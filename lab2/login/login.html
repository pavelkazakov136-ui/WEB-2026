<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="settings.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
          <h1 class="LoginText">Войти</h1>
          <div class="ImageFace">
            <img src="img/SmileFace.png" alt="Sample image">
          </div>
          <div class="right">
            <form>
                <div class="field">
                    <label for="email" class="TextStyle Email">Электропочта</label>
                    <input type="email" id="email" name="email"
                        placeholder="name@example.com" required>
                    <div class="TextStyle EmailHelp">Введите электропочту в формате *****@***.**</div>
                </div>
                <div class="field">
                    <label for="password" class="TextStyle Password">Пароль</label>
                        <input type="password" id="password" name="password"
                            placeholder="********" required>
                        <img src="img/Eye.svg" alt="Sample image" class="ImgEye">
                </div>
                <a href='main.html' class="submit-btn">Продолжить</a>
            </form>
          </div>
    </div>

</body>
</html>
